{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Swift Cart</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f1f3f6;
        }

        /* Navbar */
        .navbar {
            background-color: #2874f0;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .search-box input {
            padding: 7px;
            width: 300px;
            border: none;
            border-radius: 3px;
        }

        .cart {
            font-size: 18px;
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            background-color: white;
            padding: 40px;
            text-align: center;
            margin: 20px;
            border-radius: 8px;
        }

        .hero h1 {
            margin: 0;
        }

        /* Product Section */
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            width: 220px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            width: 220px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <div class="logo">🛒 Swift Cart</div>
        <div>
            <a href="/" style="color:white; margin-right:15px;">Home</a>
            <a href="/products/" style="color:white; margin-right:15px;">Products</a>
            <a href="/about/" style="color:white;">About</a>
            <a href="/contact/" style="color:white;">Contact</a>
        </div>

        <div class="search-box">
            <input type="text" placeholder="Search for products...">
        </div>

        <div class="product-card">Cart 🛍️</div>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Welcome to Swift Cart 🚀</h1>
        <p>Your one-stop shop for electronics</p>
    </div>

    <!-- Products -->
    <div class="products">
        
        <div class="product-card">
            <img src="{% static 'images/phone.png' %}">
            <h3>Smartphone</h3>
            <p>₹15,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">   
            <img src="{% static 'images/laptop.png' %}">
            <h3>Laptop</h3>
            <p>₹50,000</p>
            <button>Add to Cart</button>
        </div>

        <div class="product-card">   
            <img src="{% static 'images/headphone.png' %}">
            <h3>Headphones</h3>
            <p>₹2,000</p>
            <button>Add to Cart</button>
        </div>

    </div>

</body>
</html>
