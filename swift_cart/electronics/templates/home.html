{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Swift Cart</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #eef2f3, #dfe9f3);
        }

        .navbar {
            background: linear-gradient(90deg, #2874f0, #1e5ed8);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .hero {
            background: linear-gradient(90deg, #2874f0, #1e5ed8);
            color: white;
            padding: 50px;
            text-align: center;
            border-radius: 10px;
            margin: 20px;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .product-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            width: 220px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .product-card img {
            width: 100%;
            height: 150px;
            object-fit: contain;
        }

        button {
            background: linear-gradient(90deg, #2874f0, #1e5ed8);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div>🛒 Swift Cart</div>
    <div>
        <a href="/">Home</a>
        <a href="/products/">Products</a>
        <a href="/about/">About</a>
        <a href="/contact/">Contact</a>
        <a href="/cart/">Cart</a>
    </div>
</div>

<div class="hero">
    <h1>Welcome to Swift Cart 🚀</h1>
    <p>Your one-stop shop for electronics</p>
</div>

<div class="products">
    <div class="product-card">
        <img src="{% static 'images/phone.png' %}">
        <h3>Smartphone</h3>
        <p>₹15,000</p>
        <a href="/add-to-cart/Smartphone/15000/"><button>Add to Cart</button></a>
    </div>

    <div class="product-card">
        <img src="{% static 'images/laptop.png' %}">
        <h3>Laptop</h3>
        <p>₹50,000</p>
        <a href="/add-to-cart/Laptop/50000/"><button>Add to Cart</button></a>
    </div>

    <div class="product-card">
        <img src="{% static 'images/headphone.png' %}">
        <h3>Headphones</h3>
        <p>₹2,000</p>
        <a href="/add-to-cart/Headphones/2000/"><button>Add to Cart</button></a>
    </div>
</div>

</body>
</html>
