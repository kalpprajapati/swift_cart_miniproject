{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Products - Swift Cart</title>
    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f1f3f6;
        }

        .navbar {
            background-color: #2874f0;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 22px;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }

        .card {
            background: white;
            width: 200px;
            margin: 15px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card img {
            width: 100%;
        }

        .card button {
            background-color: #2874f0;
            color: white;
            border: none;
            padding: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="navbar">All Products 🛍️</div>

    <div class="products">

        <div class="card">
            <img src="{% static 'images/phone.png' %}">
            <h3>Smartphone</h3>
            <p>₹15,000</p>
            <a href="/add-to-cart/Smartphone/15000/">
                <button>Add to Cart</button>
            </a>
        </div>

        <div class="card">
            <img src="{% static 'images/laptop.png' %}">
            <h3>Laptop</h3>
            <p>₹50,000</p>
            <a href="/add-to-cart/Laptop/50000/">
                <button>Add to Cart</button>
            </a>
        </div>

        <div class="card">
            <img src="{% static 'images/headphone.png' %}">
            <h3>Headphones</h3>
            <p>₹2,000</p>
            <a href="/add-to-cart/Headphones/2000/">
                <button>Add to Cart</button>
            </a>
        </div>

    </div>

</body>
</html>
