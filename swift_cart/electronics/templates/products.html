{% load static %}
<!DOCTYPE html>
<html>
<head>
<title>Products</title>
<style>
body { background: linear-gradient(to right, #eef2f3, #dfe9f3); font-family: Arial; }

.products { display:flex; flex-wrap:wrap; justify-content:center; }

.card {
    background:white;
    padding:15px;
    margin:15px;
    border-radius:10px;
    width:220px;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card:hover {
    transform:translateY(-5px);
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.card img {
    width:100%;
    height:150px;
    object-fit:contain;
}

button {
    background:#2874f0;
    color:white;
    border:none;
    padding:10px;
}
</style>
</head>
<body>

<div class="products">

<div class="card">
<img src="{% static 'images/phone.png' %}">
<h3>Smartphone</h3>
<p>₹15000</p>
<a href="/add-to-cart/Smartphone/15000/"><button>Add to Cart</button></a>
</div>

<div class="card">
<img src="{% static 'images/laptop.png' %}">
<h3>Laptop</h3>
<p>₹50000</p>
<a href="/add-to-cart/Laptop/50000/"><button>Add to Cart</button></a>
</div>

<div class="card">
<img src="{% static 'images/headphone.png' %}">
<h3>Headphones</h3>
<p>₹2000</p>
<a href="/add-to-cart/Headphones/2000/"><button>Add to Cart</button></a>
</div>

</div>

</body>
</html>
